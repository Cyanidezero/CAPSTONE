<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <linearGradient id="brocStalk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="brocFloret" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="45%" stop-color="#15803d"/>
      <stop offset="90%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
    <filter id="brocShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#14532d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#brocShadow)">
    <!-- Sturdy Stalk -->
    <path d="M92 130 C90 160 85 185 88 198 C95 202 125 202 132 198 C135 185 130 160 128 130 Z" fill="url(#brocStalk)"/>
    <path d="M88 198 Q110 205 132 198" fill="none" stroke="#16a34a" stroke-width="2"/>

    <!-- Small side stems/petioles -->
    <path d="M96 150 Q78 140 72 125" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <path d="M124 150 Q142 140 148 125" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>

    <!-- Broccoli Floret Clusters (Rich textured canopy) -->
    <!-- Lower/outer clusters -->
    <circle cx="58" cy="118" r="26" fill="url(#brocFloret)"/>
    <circle cx="162" cy="118" r="26" fill="url(#brocFloret)"/>
    <circle cx="48" cy="90" r="24" fill="url(#brocFloret)"/>
    <circle cx="172" cy="90" r="24" fill="url(#brocFloret)"/>

    <!-- Mid clusters -->
    <circle cx="75" cy="80" r="28" fill="url(#brocFloret)"/>
    <circle cx="145" cy="80" r="28" fill="url(#brocFloret)"/>
    <circle cx="68" cy="105" r="26" fill="url(#brocFloret)"/>
    <circle cx="152" cy="105" r="26" fill="url(#brocFloret)"/>

    <!-- Central crown clusters -->
    <circle cx="110" cy="62" r="32" fill="url(#brocFloret)"/>
    <circle cx="92" cy="90" r="28" fill="url(#brocFloret)"/>
    <circle cx="128" cy="90" r="28" fill="url(#brocFloret)"/>
    <circle cx="110" cy="100" r="25" fill="url(#brocFloret)"/>

    <!-- Granular floret texture dots -->
    <g fill="#86efac" opacity="0.6">
      <circle cx="105" cy="55" r="2.5"/><circle cx="118" cy="58" r="2"/><circle cx="110" cy="68" r="2.5"/>
      <circle cx="90" cy="82" r="2"/><circle cx="130" cy="82" r="2"/><circle cx="75" cy="75" r="2.2"/>
      <circle cx="145" cy="75" r="2.2"/><circle cx="55" cy="112" r="2"/><circle cx="165" cy="112" r="2"/>
      <circle cx="108" cy="92" r="2.5"/><circle cx="96" cy="102" r="2"/><circle cx="124" cy="102" r="2"/>
    </g>

    <!-- Highlight sheen on main top -->
    <ellipse cx="106" cy="52" rx="15" ry="6" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>