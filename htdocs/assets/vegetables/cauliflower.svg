<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <radialGradient id="caulCurd" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="85%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="caulLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="caulShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#14532d" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#caulShadow)">
    <!-- Protective outer jacket leaves -->
    <path d="M35 140 C20 90 40 50 75 35 C65 75 75 125 110 145 C65 155 45 155 35 140 Z" fill="url(#caulLeaf)"/>
    <path d="M185 140 C200 90 180 50 145 35 C155 75 145 125 110 145 C155 155 175 155 185 140 Z" fill="url(#caulLeaf)"/>
    <path d="M60 175 C45 195 100 205 160 175 C145 195 75 195 60 175 Z" fill="#15803d"/>

    <!-- Central White Curd Head (Clusters of bumpy white florets) -->
    <!-- Base background curd -->
    <circle cx="110" cy="110" r="55" fill="url(#caulCurd)"/>

    <!-- Plump creamy curd bumps -->
    <circle cx="78" cy="95" r="22" fill="#fffbeb" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="142" cy="95" r="22" fill="#fffbeb" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="82" cy="130" r="20" fill="#fffbeb" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="138" cy="130" r="20" fill="#fffbeb" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="110" cy="80" r="24" fill="#ffffff" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="110" cy="115" r="25" fill="#ffffff" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="110" cy="142" r="18" fill="#fef9c3" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Leaf ribs over curd -->
    <path d="M48 100 Q80 115 100 135" fill="none" stroke="#f0fdf4" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M172 100 Q140 115 120 135" fill="none" stroke="#f0fdf4" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>