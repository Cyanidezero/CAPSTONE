<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <linearGradient id="napaBody" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#dcfce7"/>
      <stop offset="80%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="napaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#14532d" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#napaShadow)">
    <!-- Base butt -->
    <path d="M92 195 C92 202 128 202 128 195 Z" fill="#e2e8f0"/>

    <!-- Elongated Cylindrical Napa Barrel -->
    <path d="M85 195 C75 160 65 100 75 55 C82 30 138 30 145 55 C155 100 145 160 135 195 Z" fill="url(#napaBody)"/>

    <!-- Ruffled crinkly crown leaves -->
    <path d="M75 55 C70 42 85 30 95 38 C105 28 115 28 125 38 C135 30 150 42 145 55 Z" fill="#4ade80" stroke="#22c55e" stroke-width="2"/>

    <!-- Broad White Midribs (Succulent Napa Stems) -->
    <g fill="#ffffff" opacity="0.85">
      <!-- Center white stalk -->
      <path d="M102 195 L104 100 C104 80 116 80 116 100 L118 195 Z"/>
      <!-- Left stalk -->
      <path d="M85 195 L90 120 C92 105 100 108 98 125 L95 195 Z"/>
      <!-- Right stalk -->
      <path d="M135 195 L130 120 C128 105 120 108 122 125 L125 195 Z"/>
    </g>

    <!-- Ruffled leaf texture veins -->
    <g stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M88 75 Q100 65 110 72"/>
      <path d="M132 75 Q120 65 110 72"/>
      <path d="M85 95 Q100 85 105 92"/>
      <path d="M135 95 Q120 85 115 92"/>
    </g>
  </g>
</svg>