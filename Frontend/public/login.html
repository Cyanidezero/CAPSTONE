<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaYield-X · FarmerSide / DevSide</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-end; /* Places login form securely docked on the side */
            padding: 2rem 4vw 2rem 2rem;
            transition: background 0.45s ease, box-shadow 0.45s ease;
            background: linear-gradient(to right, rgba(10, 25, 12, 0.12) 0%, rgba(10, 25, 12, 0.28) 55%, rgba(10, 25, 12, 0.50) 100%), url('assets/farmer.jpg') no-repeat left 28% fixed;
            background-size: cover;
        }

        body.theme-farmer {
            background: linear-gradient(to right, rgba(10, 25, 12, 0.10) 0%, rgba(10, 25, 12, 0.25) 55%, rgba(10, 25, 12, 0.48) 100%), url('assets/farmer.jpg') no-repeat left 28% fixed;
            background-size: cover;
        }
        body.theme-dev {
            background: linear-gradient(to right, rgba(8, 20, 35, 0.12) 0%, rgba(8, 20, 35, 0.28) 55%, rgba(8, 20, 35, 0.55) 100%), url('assets/developer.jpg') no-repeat left center fixed;
            background-size: cover;
        }

        .login-card {
            max-width: 430px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2rem;
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.45),
                        inset 0 1px 2px rgba(255, 255, 255, 0.95);
            padding: 1.8rem 1.8rem 2rem;
            transition: all 0.35s ease;
            border: 1px solid rgba(255, 255, 255, 0.75);
            margin: 1rem 0;
            position: relative;
            z-index: 10;
        }

        .theme-farmer .login-card {
            box-shadow: 0 25px 55px -10px rgba(10, 35, 15, 0.4);
        }
        .theme-dev .login-card {
            box-shadow: 0 25px 55px -10px rgba(10, 25, 50, 0.4);
        }

        /* Card peek background button & state */
        .btn-peek-bg {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(80, 110, 80, 0.25);
            color: #2b4d2b;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.32rem 0.65rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            flex-shrink: 0;
        }
        .btn-peek-bg:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .theme-dev .btn-peek-bg {
            border-color: rgba(40, 80, 120, 0.25);
            color: #1f4d66;
        }

        .login-card.is-peeking {
            opacity: 0.16;
            transform: scale(0.97);
        }
        .login-card.is-peeking:hover {
            opacity: 0.92;
            transform: scale(1);
        }

        @media (max-width: 900px) {
            body {
                padding: 1.5rem 2vw 1.5rem 1.5rem;
            }
            .login-card {
                max-width: 410px;
                padding: 1.6rem 1.4rem;
            }
        }

        @media (max-width: 640px) {
            body {
                justify-content: center;
                padding: 1.2rem 1rem;
            }
            body.theme-farmer,
            body.theme-dev {
                background-position: center center !important;
            }
            .login-card {
                max-width: 100%;
                padding: 1.5rem 1.2rem;
            }
        }

        /* ---- HEADER with full title ---- */
        .login-header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
            padding-bottom: 1rem;
            border-bottom: 2px dashed rgba(80, 100, 70, 0.15);
            transition: border-color 0.3s;
        }
        .theme-dev .login-header {
            border-bottom-color: rgba(40, 80, 120, 0.15);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .login-header i {
            font-size: 2rem;
            color: #2b4d2b;
            background: rgba(60, 100, 60, 0.08);
            padding: 0.5rem;
            border-radius: 1.2rem;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .theme-dev .login-header i {
            color: #1f4d66;
            background: rgba(30, 70, 100, 0.08);
        }

        .header-icon-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.2rem;
            height: 2.2rem;
            color: #2b4d2b;
            background: rgba(60, 100, 60, 0.08);
            padding: 0.5rem;
            border-radius: 1.2rem;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .theme-dev .header-icon-slot {
            color: #1f4d66;
            background: rgba(30, 70, 100, 0.08);
        }
        .header-icon-slot svg {
            width: 100%;
            height: 100%;
        }

        .login-header h1 {
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: -0.01em;
            color: #1f3a1f;
            transition: color 0.3s;
            line-height: 1.2;
        }
        .theme-dev .login-header h1 {
            color: #1a3b4f;
        }

        .header-title-full {
            font-size: 0.85rem;
            font-weight: 500;
            color: #2d4a2d;
            opacity: 0.85;
            padding-left: 0.2rem;
            line-height: 1.4;
            transition: 0.3s;
            letter-spacing: 0.1px;
        }
        .theme-dev .header-title-full {
            color: #1f4a66;
        }

        .header-title-full i {
            font-size: 0.8rem;
            margin-right: 6px;
            opacity: 0.7;
            background: none;
            padding: 0;
            color: inherit;
        }

        /* ---- SWITCH ---- */
        .switch-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            margin: 0.3rem 0 1.8rem 0;
            background: rgba(230, 240, 230, 0.3);
            padding: 0.4rem 0.8rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(120, 160, 120, 0.1);
            transition: 0.3s;
        }
        .theme-dev .switch-wrapper {
            background: rgba(210, 230, 245, 0.3);
            border-color: rgba(70, 120, 170, 0.1);
        }

        .switch-label {
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #2b4d2b;
            opacity: 0.5;
            transition: 0.3s;
            cursor: default;
        }
        .switch-label svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }
        .theme-dev .switch-label {
            color: #1f4d66;
        }

        .switch-label.active-farm {
            opacity: 1;
            color: #1f4a1f;
        }
        .theme-dev .switch-label.active-farm {
            color: #1f4a1f;
        }
        .switch-label.active-dev {
            opacity: 1;
            color: #1a4b66;
        }
        .theme-farmer .switch-label.active-dev {
            color: #1a4b66;
        }

        .toggle {
            position: relative;
            width: 70px;
            height: 38px;
            background: #b8d0b5;
            border-radius: 40px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: 0.3s ease;
            border: 1px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
        }
        .theme-dev .toggle {
            background: #89b4c9;
        }

        .toggle .toggle-knob {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 30px;
            height: 30px;
            background: #f5faf5;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 20, 0, 0.15);
            transition: 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #2b5e2b;
        }
        .theme-dev .toggle .toggle-knob {
            left: 36px;
            background: #eaf4fc;
            color: #1f4d66;
            box-shadow: 0 4px 10px rgba(0, 30, 50, 0.15);
        }

        /* ---- PANEL ---- */
        .panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 2.5rem;
            padding: 1.8rem 1.8rem 2.2rem;
            box-shadow: 0 8px 20px rgba(30, 50, 30, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: 0.3s ease;
            margin-top: 0.5rem;
        }
        .theme-dev .panel {
            border-color: rgba(200, 225, 245, 0.5);
        }

        .panel:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 0.25rem;
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: -0.3px;
            color: #1d341d;
            transition: 0.25s;
        }
        .theme-dev .panel-title {
            color: #1a3b4f;
        }

        .panel-title i, .panel-title span.icon-slot {
            font-size: 2rem;
            width: 2.6rem;
            height: 2rem;
            text-align: center;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .panel-title span.icon-slot svg {
            width: 1.9rem;
            height: 1.9rem;
        }
        .farm-icon { color: #3f7840; }
        .theme-dev .farm-icon { color: #3f7840; }
        .dev-icon { color: #2a5f7a; }
        .theme-farmer .dev-icon { color: #2a5f7a; }

        .panel-sub svg.icon-inline, .btn-login svg.icon-inline,
        .forgot-row svg.icon-inline, .signup-hint svg.icon-inline,
        .demo-note svg.icon-inline, .header-title-full svg.icon-inline,
        .modal-header svg.icon-inline, .btn-submit svg.icon-inline {
            width: 0.95em;
            height: 0.95em;
            vertical-align: -0.12em;
            margin-right: 6px;
            flex-shrink: 0;
        }
        .btn-login svg.icon-inline, .btn-submit svg.icon-inline {
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
        }

        .knob-icon-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 0.9rem;
            height: 0.9rem;
        }
        .knob-icon-slot svg {
            width: 100%;
            height: 100%;
        }

        .panel-sub {
            font-size: 0.8rem;
            font-weight: 400;
            color: #406040;
            margin: 0.2rem 0 1.6rem 0;
            padding-left: 0.2rem;
            opacity: 0.7;
            border-left: 3px solid rgba(70, 120, 70, 0.2);
            padding-left: 0.8rem;
            transition: 0.25s;
        }
        .theme-dev .panel-sub {
            color: #2a5a70;
            border-left-color: rgba(42, 95, 122, 0.2);
        }

        .input-group {
            margin-bottom: 1.4rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #2b4d2b;
            margin-bottom: 0.3rem;
            opacity: 0.8;
            transition: 0.3s;
        }
        .theme-dev .input-group label {
            color: #1f4d66;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2rem;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border: 1px solid rgba(80, 110, 80, 0.12);
            transition: 0.3s;
            backdrop-filter: blur(2px);
        }
        .theme-dev .input-wrapper {
            border-color: rgba(40, 80, 120, 0.12);
        }

        .input-wrapper:focus-within {
            border-color: #3f7840;
            box-shadow: 0 0 0 3px rgba(60, 130, 60, 0.12);
            background: rgba(255, 255, 255, 0.85);
        }
        .theme-dev .input-wrapper:focus-within {
            border-color: #2a5f7a;
            box-shadow: 0 0 0 3px rgba(42, 95, 122, 0.12);
        }

        .input-wrapper i {
            color: #3f6b3f;
            font-size: 0.9rem;
            opacity: 0.6;
            margin-right: 0.3rem;
            transition: 0.3s;
        }
        .theme-dev .input-wrapper i {
            color: #2a5f7a;
        }

        .input-wrapper svg.field-icon {
            color: #3f6b3f;
            opacity: 0.6;
            margin-right: 0.5rem;
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            transition: 0.3s;
        }
        .theme-dev .input-wrapper svg.field-icon {
            color: #2a5f7a;
        }
        .input-wrapper:focus-within svg.field-icon {
            opacity: 0.9;
        }

        .input-group label svg.label-icon {
            width: 13px;
            height: 13px;
            margin-right: 5px;
            vertical-align: -2px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.8rem 0.8rem 0.8rem 0.4rem;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 450;
            color: #1d2e1d;
            outline: none;
        }
        .theme-dev .input-wrapper input {
            color: #1a2e3d;
        }

        .input-wrapper input::placeholder {
            color: #6d8a6d;
            font-weight: 300;
            font-size: 0.85rem;
            opacity: 0.5;
        }
        .theme-dev .input-wrapper input::placeholder {
            color: #5a7a8a;
        }

        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin: 0.2rem 0 1.4rem;
        }

        .forgot-row a {
            font-size: 0.7rem;
            color: #3f6b3f;
            text-decoration: none;
            border-bottom: 1px dotted transparent;
            transition: 0.15s;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .theme-dev .forgot-row a {
            color: #2a5f7a;
        }

        .forgot-row a:hover {
            border-bottom: 1px dotted #3f7840;
            color: #1f4a1f;
        }
        .theme-dev .forgot-row a:hover {
            border-bottom-color: #2a5f7a;
            color: #1a4055;
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: #2f5a2f;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 12px rgba(40, 80, 40, 0.12);
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-login:hover {
            background: #1e401e;
            transform: scale(1.01);
            box-shadow: 0 10px 18px rgba(30, 70, 30, 0.15);
        }
        .btn-login:active {
            transform: scale(0.97);
        }

        .btn-dev {
            background: #1f4d66;
            box-shadow: 0 6px 12px rgba(30, 70, 90, 0.12);
        }
        .btn-dev:hover {
            background: #153b4f;
        }

        .signup-hint {
            margin-top: 1.2rem;
            font-size: 0.75rem;
            text-align: center;
            color: #3d5e3d;
            opacity: 0.7;
            border-top: 1px solid rgba(80, 110, 80, 0.08);
            padding-top: 1rem;
            transition: 0.3s;
        }
        .theme-dev .signup-hint {
            color: #2a5a70;
            border-top-color: rgba(42, 95, 122, 0.08);
        }

        .signup-hint a {
            color: #1f4a1f;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px dotted transparent;
            cursor: pointer;
        }
        .theme-dev .signup-hint a {
            color: #1a4b66;
        }

        .signup-hint a:hover {
            border-bottom-color: #2f5a2f;
        }
        .theme-dev .signup-hint a:hover {
            border-bottom-color: #2a5f7a;
        }

        .demo-note {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #3a5f3a;
            opacity: 0.4;
            letter-spacing: 0.3px;
            transition: 0.3s;
        }
        .theme-dev .demo-note {
            color: #2a5a70;
        }

        .account-badge {
            display: inline-block;
            background: rgba(60, 130, 60, 0.12);
            padding: 0.15rem 0.9rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 500;
            color: #1f4a1f;
            margin-left: 0.5rem;
            border: 1px solid rgba(60, 130, 60, 0.1);
        }
        .theme-dev .account-badge {
            background: rgba(42, 95, 122, 0.12);
            color: #1a4b66;
            border-color: rgba(42, 95, 122, 0.1);
        }

        /* ---- MODAL / FORM OVERLAY ---- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 2.5rem;
            padding: 2.5rem;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-content .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px dashed rgba(80, 100, 70, 0.15);
        }

        .modal-content .modal-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1d341d;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .modal-content .modal-header h2 i {
            color: #3f7840;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #5a7a5a;
            cursor: pointer;
            transition: 0.2s;
            padding: 0.3rem;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #1f3a1f;
        }

        .modal-content .input-group {
            margin-bottom: 1.2rem;
            position: relative;
        }

        .modal-content .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #2b4d2b;
            margin-bottom: 0.3rem;
            opacity: 0.8;
        }

        .modal-content .input-wrapper {
            background: rgba(245, 250, 245, 0.8);
            border: 1px solid rgba(80, 110, 80, 0.15);
            border-radius: 2rem;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            display: flex;
            align-items: center;
            transition: 0.2s;
            position: relative;
        }

        .modal-content .input-wrapper:focus-within {
            border-color: #3f7840;
            box-shadow: 0 0 0 3px rgba(60, 130, 60, 0.12);
            background: rgba(255, 255, 255, 0.9);
        }

        .modal-content .input-wrapper i {
            color: #3f6b3f;
            font-size: 0.9rem;
            opacity: 0.6;
            margin-right: 0.3rem;
        }

        .modal-content .input-wrapper svg.field-icon {
            color: #3f6b3f;
            opacity: 0.65;
            margin-right: 0.5rem;
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }
        .modal-content .input-wrapper:focus-within svg.field-icon {
            opacity: 0.9;
        }

        .modal-content .input-group label svg.label-icon {
            width: 13px;
            height: 13px;
            margin-right: 5px;
            vertical-align: -2px;
            color: #2b4d2b;
            opacity: 0.85;
        }

        .modal-content .input-wrapper input {
            width: 100%;
            padding: 0.8rem 0.8rem 0.8rem 0.4rem;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 450;
            color: #1d2e1d;
            outline: none;
            font-family: inherit;
        }

        .modal-content .input-wrapper input::placeholder {
            color: #6d8a6d;
            font-weight: 300;
            font-size: 0.85rem;
            opacity: 0.5;
        }

        /* ---- READABLE AUTOCOMPLETE DROPDOWN ---- */
        .autocomplete-wrapper {
            position: relative;
            width: 100%;
        }

        .autocomplete-list {
            position: fixed;

            devPass: '<svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>'
        };
        const forgotLink = document.getElementById('forgotLink');
        const signupIcon = document.getElementById('signupIcon');
        const headerIcon = document.getElementById('headerIcon');
        const headerTitle = document.getElementById('headerTitle');
        const headerSub = document.getElementById('headerSub');
        const knobIcon = document.getElementById('knobIcon');
        const accountBadge = document.getElementById('accountBadge');
        const signupLink = document.getElementById('signupLink');

        // Modal elements
        const modal = document.getElementById('signupModal');
        const modalContent = document.querySelector('.modal-content');
        const modalClose = document.getElementById('modalClose');
        const modalTitle = document.getElementById('modalTitle');
        const signupBtn = document.getElementById('signupBtn');
        const farmLabelText = document.getElementById('farmLabelText');

        // Signup form inputs
        const signupName = document.getElementById('signupName');
        const signupAge = document.getElementById('signupAge');
        const signupFarm = document.getElementById('signupFarm');
        const signupEmail = document.getElementById('signupEmail');
        const signupPass = document.getElementById('signupPass');

        // Autocomplete elements (lives at body level, positioned via JS so the
        // modal's overflow-y:auto scroll box can never clip or garble it)
        const autocompleteList = document.getElementById('autocompleteList');

        const emailInput = document.getElementById('loginEmail');
        const passInput = document.getElementById('loginPass');

        let isDev = false;

        // ---- Keep the floating dropdown glued to the Farm Location field ----
        function positionAutocomplete() {
            const rect = signupFarm.getBoundingClientRect();
            autocompleteList.style.left = rect.left + 'px';
            autocompleteList.style.top = (rect.bottom + 6) + 'px';
            autocompleteList.style.width = rect.width + 'px';
        }

        // ---- READABLE AUTOCOMPLETE FUNCTION ----
        function filterLocations(query) {
            if (!query || query.length === 0) {
                autocompleteList.classList.remove('active');
                return;
            }

            const filtered = qcLocations.filter(loc => 
                loc.toLowerCase().includes(query.toLowerCase())
            );

            if (filtered.length === 0) {
                autocompleteList.classList.remove('active');
                return;
            }

            // Show top 12 results
            const topResults = filtered.slice(0, 12);
            
            autocompleteList.innerHTML = '';
            topResults.forEach(loc => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                
                // Highlight the matched part
                const index = loc.toLowerCase().indexOf(query.toLowerCase());
                let displayName = loc;
                if (index !== -1) {
                    const before = loc.substring(0, index);
                    const match = loc.substring(index, index + query.length);
                    const after = loc.substring(index + query.length);
                    displayName = `${before}<span class="highlight">${match}</span>${after}`;
                }
                
                // Determine badge
                let badge = '';
                if (loc.includes('Barangay')) {
                    badge = 'Brgy';
                } else if (loc.includes('University') || loc.includes('College')) {
                    badge = 'School';
                } else if (loc.includes('Project')) {
                    badge = 'Project';
                } else if (loc.includes('City') && !loc.includes('Quezon')) {
                    badge = 'District';
                } else if (loc.includes('Quezon City')) {
                    badge = 'QC';
                } else {
                    badge = 'Loc';
                }
                
                item.innerHTML = `
                    <span class="loc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
                    <span class="loc-name">${displayName}</span>
                    <span class="loc-badge">${badge}</span>
                `;
                
                item.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    signupFarm.value = loc;
                    autocompleteList.classList.remove('active');
                });
                autocompleteList.appendChild(item);
            });
            
            positionAutocomplete();
            autocompleteList.classList.add('active');
        }

        // ---- SIGNUP FARM INPUT EVENTS ----
        signupFarm.addEventListener('input', function(e) {
            filterLocations(this.value);
        });

        signupFarm.addEventListener('blur', function(e) {
            setTimeout(() => {
                autocompleteList.classList.remove('active');
            }, 200);
        });

        signupFarm.addEventListener('focus', function(e) {
            if (this.value && this.value.length > 0) {
                filterLocations(this.value);
            }
        });

        // Reposition (or close) if the viewport or the modal's own scroll changes,
        // so the list never drifts away from the field or gets cut off.
        window.addEventListener('resize', function() {
            if (autocompleteList.classList.contains('active')) positionAutocomplete();
        });
        if (modalContent) {
            modalContent.addEventListener('scroll', function() {
                autocompleteList.classList.remove('active');
            });
        }

        // Close autocomplete on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                autocompleteList.classList.remove('active');
            }
        });

        // ---- MODAL CONTROLS ----
        function openModal() {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('signupForm').reset();
            autocompleteList.classList.remove('active');
            
            if (isDev) {
                modalTitle.innerHTML = '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"></rect><path d="M9 9l-2 2 2 2"></path><path d="M15 9l2 2-2 2"></path><path d="M2 20h20"></path></svg> Create Developer Profile';
                signupBtn.className = 'btn-submit dev-btn';
                signupBtn.innerHTML = '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg> Create Dev Account';
                farmLabelText.textContent = 'Dev Location';
                signupFarm.placeholder = 'Quezon City, Philippines';
            } else {
                modalTitle.innerHTML = '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="17" r="3"></circle><circle cx="18" cy="17" r="2.4"></circle><path d="M3 8h6v5H3z"></path><path d="M9 11h4l3 3h2.5"></path><path d="M13 8V6h3l2 3"></path><path d="M9 8V6"></path></svg> Create Farmer Profile';
                signupBtn.className = 'btn-submit';
                signupBtn.innerHTML = '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg> Create Account';
                farmLabelText.textContent = 'Farm Location';
                signupFarm.placeholder = 'Quezon City, Philippines';
            }
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            autocompleteList.classList.remove('active');
        }

        signupLink.addEventListener('click', function(e) {
            e.preventDefault();
            openModal();
        });

        modalClose.addEventListener('click', closeModal);

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // ---- SIGNUP HANDLER ----
        window.handleSignup = function(event) {
            event.preventDefault();
            
            const name = signupName.value.trim();
            const age = signupAge.value.trim();
            const farm = signupFarm.value.trim();
            const email = signupEmail.value.trim();
            const password = signupPass.value.trim();

            // Validation
            if (!name || !age || !farm || !email || !password) {
                alert('⚠️ Please fill in all fields.');
                return;
            }

            if (parseInt(age) < 18 || parseInt(age) > 99) {
                alert('⚠️ Age must be between 18 and 99.');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                alert('⚠️ Please enter a valid email address.');
                return;
            }

            if (password.length < 4) {
                alert('⚠️ Password must be at least 4 characters.');
                return;
            }

            // Check if farm location is in QC database (case insensitive)
            const isQC = qcLocations.some(loc => 
                loc.toLowerCase() === farm.toLowerCase()
            );

            let locationNote = '';
            if (!isQC) {
                locationNote = '\n\n⚠️ Note: This location may not be in Quezon City. Please ensure accuracy.';
            }

            const role = isDev ? 'Developer' : 'Farmer';
            const locationLabel = isDev ? 'Dev Location' : 'Farm Location';

            // Success message
            alert(`✅ ${role} profile created successfully!\n\n👤 Name: ${name}\n📧 Email: ${email}\n📍 ${locationLabel}: ${farm}\n🔑 Password: ${'•'.repeat(password.length)}${locationNote}\n\n🎉 Your account has been registered. Please login with your credentials.`);

            // Auto-fill login form with new credentials
            emailInput.value = email;
            passInput.value = password;

            // Close modal
            closeModal();
        };

        // ---- update whole UI ----
        function updateMode(devMode) {
            isDev = devMode;

            // 1. BODY theme
            body.classList.remove('theme-farmer', 'theme-dev');
            body.classList.add(devMode ? 'theme-dev' : 'theme-farmer');

            // 2. toggle knob
            if (devMode) {
                knobIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>';
                knobIcon.style.color = '#1f4d66';
                farmLabel.classList.remove('active-farm');
                devLabel.classList.add('active-dev');
            } else {
                knobIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"></path><path d="M12 10C12 6 9 4 5 4c0 4 2 7 6 7z"></path><path d="M12 10c0-4 3-6 7-6 0 4-2 7-6 7z"></path></svg>';
                knobIcon.style.color = '#2b5e2b';
                devLabel.classList.remove('active-dev');
                farmLabel.classList.add('active-farm');
            }

            // 3. panel content + account badge
            if (devMode) {
                // DevSide (blue)
                panelIcon.className = 'icon-slot dev-icon';
                panelIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"></rect><path d="M9 9l-2 2 2 2"></path><path d="M15 9l2 2-2 2"></path><path d="M2 20h20"></path></svg>';
                panelName.textContent = 'DevSide';
                subText.textContent = 'build, deploy & monitor agri-solutions';
                emailLabel.textContent = 'Dev email';
                passLabel.textContent = 'Access key';
                forgotText.textContent = 'reset dev token';
                btnText.textContent = 'Log in · Developer';
                signupText.innerHTML = 'New dev? <a id="signupLink">create dev profile</a>';
                loginBtn.className = 'btn-login btn-dev';
                btnIcon.innerHTML = '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"></rect><path d="M9 9l-2 2 2 2"></path><path d="M15 9l2 2-2 2"></path><path d="M2 20h20"></path></svg>';
                inputIcon.innerHTML = loginFieldIcons.devEmail;
                passIcon.innerHTML = loginFieldIcons.devPass;
                forgotLink.innerHTML = '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M9 9h.01"></path><path d="M15 9h.01"></path><path d="M9 15h6"></path></svg> <span id="forgotText">reset dev token</span>';
                signupIcon.innerHTML = '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path></svg>';
                emailInput.placeholder = 'dev@agritech.io';
                emailInput.value = accounts.dev.email;
                passInput.placeholder = '••••••••';
                passInput.value = accounts.dev.password;
                const psi1 = document.getElementById('panelSubIcon');
                if (psi1) psi1.outerHTML = '<svg id="panelSubIcon" class="icon-inline panel-sub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 13 14 20 7"></polyline><polyline points="14 7 20 7 20 13"></polyline></svg>';
                headerIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"></rect><path d="M9 9l-2 2 2 2"></path><path d="M15 9l2 2-2 2"></path><path d="M2 20h20"></path></svg>';
                headerTitle.textContent = 'ClimaYield-X';
                accountBadge.textContent = 'dev account';
                accountBadge.style.display = 'inline-block';
            } else {
                // FarmerSide (green)
                panelIcon.className = 'icon-slot farm-icon';
                panelIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="17" r="3"></circle><circle cx="18" cy="17" r="2.4"></circle><path d="M3 8h6v5H3z"></path><path d="M9 11h4l3 3h2.5"></path><path d="M13 8V6h3l2 3"></path><path d="M9 8V6"></path></svg>';
                panelName.textContent = 'FarmerSide';
                subText.textContent = 'access your crops, weather & tasks';
                emailLabel.textContent = 'Email';
                passLabel.textContent = 'Password';
                forgotText.textContent = 'forgot field pass?';
                btnText.textContent = 'Log in · Farmer';
                signupText.innerHTML = 'New? <a id="signupLink">create farm profile</a>';
                loginBtn.className = 'btn-login';
                btnIcon.innerHTML = '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>';
                inputIcon.innerHTML = loginFieldIcons.farmerEmail;
                passIcon.innerHTML = loginFieldIcons.farmerPass;
                forgotLink.innerHTML = '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"></path><path d="M12 10C12 6 9 4 5 4c0 4 2 7 6 7z"></path><path d="M12 10c0-4 3-6 7-6 0 4-2 7-6 7z"></path></svg> <span id="forgotText">forgot field pass?</span>';
                signupIcon.innerHTML = '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>';
                emailInput.placeholder = 'farmer@agri.coop';
                emailInput.value = accounts.farmer.email;
                passInput.placeholder = '••••••••';
                passInput.value = accounts.farmer.password;
                const psi2 = document.getElementById('panelSubIcon');
                if (psi2) psi2.outerHTML = '<svg id="panelSubIcon" class="icon-inline panel-sub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
                headerIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="17" r="3"></circle><circle cx="18" cy="17" r="2.4"></circle><path d="M3 8h6v5H3z"></path><path d="M9 11h4l3 3h2.5"></path><path d="M13 8V6h3l2 3"></path><path d="M9 8V6"></path></svg>';
                headerTitle.textContent = 'ClimaYield-X';
                accountBadge.textContent = 'farmer account';
                accountBadge.style.display = 'inline-block';
            }

            // Re-bind signup link (it gets replaced in innerHTML)
            const newSignupLink = document.getElementById('signupLink');
            if (newSignupLink) {
                newSignupLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    openModal();
                });
            }
        }

        // ---- toggle click ----
        toggle.addEventListener('click', function(e) {
            e.stopPropagation();
            updateMode(!isDev);
        });

        toggle.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                updateMode(!isDev);
            }
        });

        // ---- LOGIN HANDLER with account validation ----
        window.handleLogin = function(event) {
            event.preventDefault();
            const email = emailInput.value.trim();
            const password = passInput.value.trim();
            const role = isDev ? 'dev' : 'farmer';
            const panelNameStr = isDev ? '💻 DevSide' : '🌾 FarmerSide';

            if (!email || !password) {
                alert(`⚠️ ${panelNameStr}\nPlease fill in both email and password.`);
                return;
            }

            const account = accounts[role];
            
            if (email === account.email && password === account.password) {
                alert(`✅ ${panelNameStr} login successful!\n\n👤 ${account.name}\n📧 ${email}\n🔑 password: ${'•'.repeat(password.length)}\n\n${isDev ? '🛠️ Dev access granted. Ready to push.' : '🌱 Welcome back, farmer! Your fields are ready.'}\n\n( demo account – no actual auth )`);
                console.log(`[${role}] login success:`, { email, password, name: account.name });
            } else {
                let errorMsg = `❌ ${panelNameStr} login failed!\n\n`;
                if (email !== account.email && password !== account.password) {
                    errorMsg += '❌ Invalid email AND password.\n';
                } else if (email !== account.email) {
                    errorMsg += '❌ Invalid email address.\n';
                } else {
                    errorMsg += '❌ Invalid password.\n';
                }
                errorMsg += `\n💡 Hint: Use the demo credentials shown in the form.`;
                alert(errorMsg);
                console.log(`[${role}] login failed:`, { email, password, expected: account });
            }
        };

        // ---- Peek Background Button ----
        const peekBtn = document.getElementById('peekBgBtn');
        const loginCard = document.getElementById('loginCard');
        if (peekBtn && loginCard) {
            peekBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                loginCard.classList.toggle('is-peeking');
                const isPeeking = loginCard.classList.contains('is-peeking');
                const peekText = peekBtn.querySelector('.peek-text');
                if (peekText) peekText.textContent = isPeeking ? 'Restore' : 'View BG';
                peekBtn.style.background = isPeeking ? 'rgba(0, 0, 0, 0.75)' : '';
                peekBtn.style.color = isPeeking ? '#ffffff' : '';
                peekBtn.style.borderColor = isPeeking ? 'rgba(255, 255, 255, 0.5)' : '';
            });
        }

        // ---- init: farmer mode ----
        updateMode(false);
    })();
</script>
</body>
</html>
