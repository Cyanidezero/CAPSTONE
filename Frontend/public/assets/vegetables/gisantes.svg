<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <linearGradient id="peaPod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="peaBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="45%" stop-color="#4ade80"/>
      <stop offset="85%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <filter id="peaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#14532d" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#peaShadow)">
    <!-- Stem & Calyx sepals -->
    <path d="M185 52 Q172 58 162 68" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <polygon points="162,68 152,60 156,72 148,78 160,80 162,68" fill="#15803d"/>

    <!-- Lower Pod Valve -->
    <path d="M162 75 C140 105 100 150 45 185 C35 190 32 180 40 170 C85 130 130 85 162 75 Z" fill="url(#peaPod)"/>

    <!-- Inside Peas (Shiny, round, delicious) -->
    <circle cx="68" cy="155" r="13" fill="url(#peaBall)"/>
    <circle cx="92" cy="132" r="13" fill="url(#peaBall)"/>
    <circle cx="116" cy="110" r="13" fill="url(#peaBall)"/>
    <circle cx="138" cy="88" r="12" fill="url(#peaBall)"/>

    <!-- Pea shine dots -->
    <circle cx="65" cy="150" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="89" cy="127" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="113" cy="105" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="135" cy="84" r="2.8" fill="#ffffff" opacity="0.6"/>

    <!-- Upper Pod Flap (Folded back) -->
    <path d="M162 75 C135 88 95 125 50 162 C45 152 75 110 120 78 C140 68 155 70 162 75 Z" fill="url(#peaPod)" opacity="0.85"/>
  </g>
</svg>