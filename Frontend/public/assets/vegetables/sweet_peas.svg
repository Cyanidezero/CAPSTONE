<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <linearGradient id="sitsPod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="sitsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#15803d" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sitsShadow)">
    <!-- Pod 1 (Main curved flat snow pea) -->
    <path d="M168 60 C145 78 105 118 62 165 C48 180 35 185 30 182 C28 178 35 168 50 150 C95 98 140 65 168 60 Z" fill="url(#sitsPod)"/>

    <!-- Translucent small bump outlines of peas inside -->
    <ellipse cx="65" cy="150" rx="9" ry="6" transform="rotate(-40 65 150)" fill="#86efac" opacity="0.7"/>
    <ellipse cx="90" cy="125" rx="9" ry="6" transform="rotate(-40 90 125)" fill="#86efac" opacity="0.7"/>
    <ellipse cx="115" cy="100" rx="9" ry="6" transform="rotate(-40 115 100)" fill="#86efac" opacity="0.7"/>
    <ellipse cx="140" cy="76" rx="8" ry="5.5" transform="rotate(-40 140 76)" fill="#86efac" opacity="0.7"/>

    <!-- Stem end with sepals -->
    <path d="M178 48 Q170 54 168 60" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <polygon points="168,60 162,52 165,65" fill="#15803d"/>
  </g>
</svg>