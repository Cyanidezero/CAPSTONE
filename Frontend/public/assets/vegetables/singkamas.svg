    <path d="M110 70 Q105 45 95 35" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <path d="M110 70 Q118 45 125 35" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

    <!-- Taproot bottom -->
