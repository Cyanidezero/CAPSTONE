    <filter id="singShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#92400e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#singShadow)">
